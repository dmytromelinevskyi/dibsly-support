<!doctype html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!--page-head-->
  <meta name="theme-color" content="#100f0d">
  <script>
    // The landing's reveals wait for its script (main's .js); with «reduce motion» they are simply there.
    document.documentElement.classList.add('js');
    try {
      if (matchMedia('(prefers-reduced-motion: reduce)').matches || localStorage.getItem('dibsly.motion.v2') === 'reduced')
        document.documentElement.classList.add('no-motion');
    } catch (error) {}
  </script>
  <link rel="icon" type="image/png" href="./assets/brand/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geologica:wght@400;500;600;700;800;900&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body><div id="root"><!--app-html--></div><script type="module" src="/src/app/entry-client.jsx"></script></body>
</html>
