<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <meta name="description" content="A bill shared from Dibsly: tap your items and see your part.">
    <title>Split the bill</title>
    <style>
        :root {
            color-scheme: light dark;
            --background: #f6f3ee;
            --surface: #ffffff;
            --text: #1c1a17;
            --secondary: #6b665e;
            --border: rgba(28, 26, 23, 0.1);
            --accent: #f2a33a;
            --accent-text: #b8640f;
            --accent-soft: rgba(242, 163, 58, 0.16);
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --background: #0f0e0d;
                --surface: #1d1b19;
                --text: #f4f1ec;
                --secondary: #a39d94;
                --border: rgba(255, 255, 255, 0.09);
                --accent-text: #f4b25c;
                --accent-soft: rgba(242, 163, 58, 0.2);
            }
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: var(--background);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
            font-size: 17px;
            line-height: 1.45;
            -webkit-tap-highlight-color: transparent;
        }
        main { width: min(560px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 140px; }
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 18px;
            margin-bottom: 12px;
        }
        .head { text-align: center; }
        .merchant { font-weight: 650; font-size: 17px; }
        .part { font-size: 40px; font-weight: 750; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
        .muted { color: var(--secondary); font-size: 14px; }
        .hint { color: var(--secondary); font-size: 14px; margin: 0 0 8px; }
        .row { border-top: 1px solid var(--border); }
        .row:first-of-type { border-top: 0; }
        .item {
            display: flex; align-items: center; gap: 10px;
            width: 100%; min-height: 48px; padding: 6px 0;
            border: 0; background: none; color: inherit; font: inherit; text-align: left; cursor: pointer;
        }
        .check {
            flex: none; width: 26px; height: 26px; border-radius: 50%;
            border: 2px solid var(--secondary); display: grid; place-items: center;
            color: #1c1a17; font-size: 15px; font-weight: 800;
        }
        .item.mine .check { background: var(--accent); border-color: var(--accent); }
        .name { flex: 1; }
        .qty { color: var(--secondary); font-size: 14px; margin-left: 4px; }
        .amount { flex: none; white-space: nowrap; color: var(--secondary); font-variant-numeric: tabular-nums; }
        /* The friend's part of a marked item, on its own line under it (owner, 2026-10-03: − and + squeezed the
           name and the amount into a narrow column). */
        .partline { display: flex; align-items: center; gap: 8px; padding: 0 0 8px 36px; }
        .partline[hidden] { display: none; }
        .partline .mine { flex: 1; color: var(--accent-text); font-size: 14px; font-weight: 650;
                          font-variant-numeric: tabular-nums; }
        .share {
            flex: none; min-width: 44px; height: 32px; border-radius: 16px;
            border: 1px solid var(--border); background: none; color: var(--accent-text);
            font: inherit; font-size: 14px; font-weight: 650; cursor: pointer;
        }
        .share[hidden] { display: none; }
        .bar {
            position: fixed; left: 0; right: 0; bottom: 0;
            padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
            background: var(--background); border-top: 1px solid var(--border);
        }
        .bar-inner { width: min(560px, 100%); margin: 0 auto; display: flex; gap: 10px; }
        .bar button {
            flex: 1; min-height: 50px; border-radius: 25px; border: 0;
            font: inherit; font-weight: 650; cursor: pointer;
        }
        .primary { background: var(--accent); color: #1c1a17; }
        .secondary { background: var(--accent-soft); color: var(--accent-text); }
        .footer { text-align: center; margin-top: 18px; }
        .footer a { color: var(--accent-text); }
        .error { text-align: center; padding: 60px 0; }
    </style>
</head>
<body>
<main id="app"><p class="error" id="loading">…</p></main>
<div class="bar" id="bar" hidden>
    <div class="bar-inner">
        <button class="secondary" id="clear" type="button"></button>
        <button class="primary" id="copy" type="button"></button>
    </div>
</div>
<script>
(() => {
    // The receipt travels in the link's # part (format 1 of Dibsly's ReceiptShareLink): raw-deflated JSON in
    // base64url. Nothing is sent anywhere; the choices stay on this device.
    const lang = (navigator.language || "en").slice(0, 2);
    const strings = {
        en: { title: "Split the bill", yours: "Your part", of: "of {0} · at the receipt’s prices; tips shared in proportion",
              bonus: "Bonuses and discounts −{0} · paid {1}",
              hint: "Tap what’s yours. ½ shares an item with others; − and + set how many of several are yours.", clear: "Clear", copy: "Copy my part",
              copied: "Copied", items: "items", broken: "This link is incomplete. Ask for it again.",
              old: "Open this link in Safari or Chrome.", made: "Made with", mine: "My part: {0} — {1}" },
        uk: { title: "Поділити рахунок", yours: "Твоя частина", of: "з {0} · за цінами чека; чайові — пропорційно",
              bonus: "Бонуси й знижки −{0} · сплачено {1}",
              hint: "Торкнись свого. ½ ділить позицію з іншими; − і + — скільки з кількох твоїх.", clear: "Очистити",
              copy: "Скопіювати мою частину", copied: "Скопійовано", items: "позицій",
              broken: "Посилання неповне. Попроси надіслати його ще раз.",
              old: "Відкрий це посилання в Safari чи Chrome.", made: "Зроблено в", mine: "Моя частина: {0} — {1}" },
        ru: { title: "Разделить счёт", yours: "Твоя часть", of: "из {0} · по ценам чека; чаевые — пропорционально",
              bonus: "Бонусы и скидки −{0} · оплачено {1}",
              hint: "Нажми на своё. ½ делит позицию с другими; − и + — сколько из нескольких твоих.", clear: "Очистить",
              copy: "Скопировать мою часть", copied: "Скопировано", items: "позиций",
              broken: "Ссылка неполная. Попроси прислать её ещё раз.",
              old: "Открой эту ссылку в Safari или Chrome.", made: "Сделано в", mine: "Моя часть: {0} — {1}" }
    };
    const t = strings[lang] || strings.en;
    const fill = (text, ...values) => values.reduce((s, v, i) => s.replace("{" + i + "}", v), text);
    document.documentElement.lang = strings[lang] ? lang : "en";
    document.title = t.title;
    const app = document.getElementById("app");

    function fail(message) {
        app.innerHTML = "";
        const p = document.createElement("p");
        p.className = "error";
        p.textContent = message;
        app.appendChild(p);
    }

    async function decode(fragment) {
        let base64 = fragment.replace(/-/g, "+").replace(/_/g, "/");
        base64 += "=".repeat((4 - base64.length % 4) % 4);
        const bytes = Uint8Array.from(atob(base64), c => c.charCodeAt(0));
        const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
        return JSON.parse(await new Response(stream).text());
    }

    function render(receipt) {
        const currency = receipt.c || "UAH";
        let format;
        try {
            format = new Intl.NumberFormat(navigator.language, { style: "currency", currency });
        } catch (error) {
            format = new Intl.NumberFormat(navigator.language, { minimumFractionDigits: 2 });
        }
        const money = minor => format.format(minor / 100);
        const items = (receipt.i || []).map((row, index) => {
            const qty = String(row[2] || "");
            const count = /^\d+$/.test(qty.trim()) ? Number(qty) : 0;
            // A whole quantity above one (15 beers): a friend takes some of them, not a share of the line.
            return { id: index, name: String(row[0] || ""), minor: Number(row[1]) || 0, qty,
                     units: count > 1 && count <= 999 ? count : 0 };
        }).filter(item => item.minor > 0);
        const itemsSum = items.reduce((sum, item) => sum + item.minor, 0);
        const total = Number(receipt.t) || itemsSum;
        const key = "dibsly-split-" + location.hash.slice(1, 40);
        // shares[id] = { people: n } or { units: k }; absent = not mine.
        let shares = {};
        try { shares = JSON.parse(localStorage.getItem(key + "-v2") || "{}"); } catch (error) { shares = {}; }
        const fraction = (item, share) => {
            if (!share) return 0;
            if (share.units) return item.units ? Math.min(share.units, item.units) / item.units : 1;
            return share.people ? 1 / share.people : 0;
        };

        app.innerHTML = "";
        const head = document.createElement("section");
        head.className = "card head";
        head.innerHTML = '<div class="merchant"></div><div class="muted"></div><div class="part"></div><div class="muted of"></div>';
        head.querySelector(".merchant").textContent = receipt.m || t.title;
        head.querySelector(".muted").textContent = t.yours;
        head.querySelector(".of").textContent = fill(t.of, money(total));
        // Bonuses and discounts are the payer's: shown once, never spread over the items (owner, 2026-10-03).
        if (itemsSum > total * 1.02) {
            const bonus = document.createElement("div");
            bonus.className = "muted";
            bonus.textContent = fill(t.bonus, money(itemsSum - total), money(total));
            head.appendChild(bonus);
        }
        app.appendChild(head);

        const list = document.createElement("section");
        list.className = "card";
        const hint = document.createElement("p");
        hint.className = "hint";
        hint.textContent = t.hint;
        list.appendChild(hint);
        const rows = items.map(item => {
            const row = document.createElement("div");
            row.className = "row";
            const line = document.createElement("div");
            line.className = "partline";
            const part = document.createElement("span");
            part.className = "mine";
            const button = document.createElement("button");
            button.type = "button";
            button.className = "item";
            button.innerHTML = '<span class="check" aria-hidden="true"></span><span class="name"></span><span class="amount"></span>';
            button.querySelector(".name").textContent = item.name;
            if (item.qty && item.qty !== "1") {
                const qty = document.createElement("span");
                qty.className = "qty";
                qty.textContent = "× " + item.qty;
                button.querySelector(".name").appendChild(qty);
            }
            button.querySelector(".amount").textContent = money(item.minor);
            const share = document.createElement("button");
            share.type = "button";
            share.className = "share";
            const plus = document.createElement("button");
            plus.type = "button";
            plus.className = "share";
            plus.textContent = "+";
            button.addEventListener("click", () => {
                if (shares[item.id]) delete shares[item.id];
                else shares[item.id] = item.units ? { units: 1 } : { people: 1 };
                update();
            });
            share.addEventListener("click", () => {
                const current = shares[item.id] || {};
                if (item.units) {
                    if ((current.units || 0) > 1) shares[item.id] = { units: current.units - 1 };
                    else delete shares[item.id];
                } else {
                    const next = { 1: 2, 2: 3, 3: 4, 4: 1 };
                    shares[item.id] = { people: next[current.people || 1] };
                }
                update();
            });
            plus.addEventListener("click", () => {
                const current = shares[item.id] || { units: 0 };
                shares[item.id] = { units: Math.min((current.units || 0) + 1, item.units) };
                update();
            });
            line.appendChild(part);
            line.appendChild(share);
            line.appendChild(plus);
            row.appendChild(button);
            row.appendChild(line);
            list.appendChild(row);
            return { item, button, line, part, share, plus };
        });
        app.appendChild(list);

        const footer = document.createElement("p");
        footer.className = "muted footer";
        footer.innerHTML = t.made + ' <a href="https://dmytromelinevskyi.github.io/dibsly-support/">Dibsly</a>';
        app.appendChild(footer);

        const myPart = () => {
            if (!itemsSum) return 0;
            const mine = items.reduce((sum, item) => sum + item.minor * fraction(item, shares[item.id]), 0);
            // At the receipt's prices; only tips or service on top of the items follow in proportion.
            return Math.round(mine * Math.max(total / itemsSum, 1));
        };

        function update() {
            rows.forEach(({ item, button, line, part, share, plus }) => {
                const current = shares[item.id];
                const mine = Boolean(current);
                button.classList.toggle("mine", mine);
                button.setAttribute("aria-pressed", mine ? "true" : "false");
                button.querySelector(".check").textContent = mine ? "✓" : "";
                line.hidden = !mine;
                plus.hidden = !item.units;
                if (!mine) return;
                const amount = money(Math.round(item.minor * fraction(item, current)));
                if (item.units) {
                    share.textContent = "−";
                    plus.disabled = current.units >= item.units;
                    part.textContent = current.units + "/" + item.units + " · " + amount;
                } else {
                    share.textContent = current.people > 1 ? "1/" + current.people : "½";
                    part.textContent = (current.people > 1 ? "1/" + current.people + " · " : "") + amount;
                }
            });
            head.querySelector(".part").textContent = money(myPart());
            try { localStorage.setItem(key + "-v2", JSON.stringify(shares)); } catch (error) { /* private mode */ }
        }

        const bar = document.getElementById("bar");
        const clear = document.getElementById("clear");
        const copy = document.getElementById("copy");
        clear.textContent = t.clear;
        copy.textContent = t.copy;
        clear.addEventListener("click", () => { shares = {}; update(); });
        copy.addEventListener("click", async () => {
            const names = items.filter(item => shares[item.id]).map(item => {
                const share = shares[item.id];
                if (share.units) return item.name + " ×" + share.units;
                return share.people > 1 ? item.name + " (1/" + share.people + ")" : item.name;
            });
            const text = fill(t.mine, money(myPart()), names.join(", "));
            try {
                await navigator.clipboard.writeText(text);
                copy.textContent = t.copied;
                setTimeout(() => { copy.textContent = t.copy; }, 1500);
            } catch (error) { /* clipboard not allowed */ }
        });
        bar.hidden = false;
        update();
    }

    const fragment = location.hash.slice(1);
    if (!fragment) return fail(t.broken);
    if (typeof DecompressionStream === "undefined") return fail(t.old);
    decode(fragment).then(receipt => {
        if (!receipt || receipt.v !== 1) return fail(t.broken);
        render(receipt);
    }).catch(() => fail(t.broken));
})();
</script>
</body>
</html>
