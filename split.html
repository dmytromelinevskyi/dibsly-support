<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <meta name="description" content="A bill shared from Dibsly: tap your items and see your part.">
    <title>Розділи рахунок · Dibsly</title>
    <!-- The card messengers show under the link (owner, 2026-10-05: the bare link looked like a scam). The bill
         itself stays in the link's # part, which no server — this one included — ever receives. -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Dibsly">
    <meta property="og:title" content="Розділи рахунок · Dibsly">
    <meta property="og:description" content="Обери свої позиції — побачиш свою частину. Без реєстрації та застосунку.">
    <meta property="og:image" content="https://dmytromelinevskyi.github.io/dibsly-support/img/split-card.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="icon" href="img/favicon.png">
    <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
    <style>
        :root {
            color-scheme: light dark;
            --background: #f6f3ee;
            --surface: #ffffff;
            --text: #1c1a17;
            --secondary: #6b665e;
            --border: rgba(28, 26, 23, 0.1);
            --accent: #f2a33a;
            --accent-text: #b8640f;
            --accent-soft: rgba(242, 163, 58, 0.16);
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --background: #0f0e0d;
                --surface: #1d1b19;
                --text: #f4f1ec;
                --secondary: #a39d94;
                --border: rgba(255, 255, 255, 0.09);
                --accent-text: #f4b25c;
                --accent-soft: rgba(242, 163, 58, 0.2);
            }
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            background: var(--background);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
            font-size: 17px;
            line-height: 1.45;
            -webkit-tap-highlight-color: transparent;
        }
        main { width: min(560px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 140px; }
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 18px;
            margin-bottom: 12px;
        }
        .head { text-align: center; }
        .merchant { font-weight: 650; font-size: 17px; }
        .part { font-size: 40px; font-weight: 750; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
        .muted { color: var(--secondary); font-size: 14px; }
        .hint { color: var(--secondary); font-size: 14px; margin: 0 0 8px; }
        .row { border-top: 1px solid var(--border); }
        .row:first-of-type { border-top: 0; }
        .item {
            display: flex; align-items: center; gap: 10px;
            width: 100%; min-height: 48px; padding: 6px 0;
            border: 0; background: none; color: inherit; font: inherit; text-align: left; cursor: pointer;
        }
        .check {
            flex: none; width: 26px; height: 26px; border-radius: 50%;
            border: 2px solid var(--secondary); display: grid; place-items: center;
            color: #1c1a17; font-size: 15px; font-weight: 800;
        }
        .item.mine .check { background: var(--accent); border-color: var(--accent); }
        .name { flex: 1; }
        .qty { color: var(--secondary); font-size: 14px; margin-left: 4px; }
        .amount { flex: none; white-space: nowrap; color: var(--secondary); font-variant-numeric: tabular-nums; }
        /* The friend's part of a marked item, on its own line under it (owner, 2026-10-03: − and + squeezed the
           name and the amount into a narrow column). */
        .partline { display: flex; align-items: center; gap: 8px; padding: 0 0 8px 36px; }
        .partline[hidden] { display: none; }
        .partline .mine { flex: 1; color: var(--accent-text); font-size: 14px; font-weight: 650;
                          font-variant-numeric: tabular-nums; }
        .share {
            flex: none; min-width: 44px; height: 32px; border-radius: 16px;
            border: 1px solid var(--border); background: none; color: var(--accent-text);
            font: inherit; font-size: 14px; font-weight: 650; cursor: pointer;
        }
        .share[hidden] { display: none; }
        .bar {
            position: fixed; left: 0; right: 0; bottom: 0;
            padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
            background: var(--background); border-top: 1px solid var(--border);
        }
        .bar-inner { width: min(560px, 100%); margin: 0 auto; display: flex; gap: 10px; }
        .bar button {
            flex: 1; min-height: 50px; border-radius: 25px; border: 0;
            font: inherit; font-weight: 650; cursor: pointer;
        }
        .primary { background: var(--accent); color: #1c1a17; }
        .secondary { background: var(--accent-soft); color: var(--accent-text); }
        /* Tips on top of the friend's part (owner, 2026-10-04): the usual percents or their own. */
        .tiphead { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px; }
        .tiphead strong { font-size: 17px; }
        .tipamount { color: var(--accent-text); font-weight: 650; font-variant-numeric: tabular-nums; }
        .chips { display: flex; gap: 6px; }
        .chip {
            flex: 1; min-width: 0; height: 36px; padding: 0; border-radius: 18px; border: 1px solid var(--border);
            background: none; color: inherit; font: inherit; font-size: 14px; cursor: pointer; white-space: nowrap;
            font-variant-numeric: tabular-nums;
        }
        .chip.on { background: var(--accent); border-color: var(--accent); color: #1c1a17; font-weight: 650; }
        .tipown { display: flex; align-items: center; gap: 6px; margin-top: 10px; }
        .tipown[hidden] { display: none; }
        .tipown input {
            flex: 1; min-height: 44px; padding: 0 12px; border-radius: 12px; border: 1px solid var(--border);
            background: none; color: inherit; font: inherit; font-variant-numeric: tabular-nums;
        }
        .tipline { color: var(--accent-text); font-size: 14px; font-weight: 650; font-variant-numeric: tabular-nums; }
        /* Always one line tall: it appeared with the first tapped item and pushed the page down (2026-10-05). */
        .tipline { min-height: 1.45em; }
        .table { display: flex; align-items: center; gap: 12px; }
        .table strong { flex: 1; }
        .table output { min-width: 28px; text-align: center; font-size: 20px; font-weight: 650;
                        font-variant-numeric: tabular-nums; }
        .round { width: 44px; height: 44px; border-radius: 22px; border: 1px solid var(--border); background: none;
                 color: var(--accent-text); font: inherit; font-size: 22px; cursor: pointer; }
        .round:disabled { opacity: 0.35; cursor: default; }
        .feehead { color: var(--secondary); font-size: 14px; font-weight: 650; margin: 0 0 8px; }
        select.share { appearance: none; -webkit-appearance: none; padding: 0 14px; text-align: center; }
        .card .note { margin: 10px 0 0; }
        .footer { text-align: center; margin-top: 18px; }
        .footer a { color: var(--accent-text); }
        .error { text-align: center; padding: 60px 0; }
    </style>
</head>
<body>
<main id="app"><p class="error" id="loading">…</p></main>
<div class="bar" id="bar" hidden>
    <div class="bar-inner">
        <button class="secondary" id="clear" type="button"></button>
        <button class="primary" id="copy" type="button"></button>
    </div>
</div>
<script>
(() => {
    // The receipt travels in the link's # part (format 1 of Dibsly's ReceiptShareLink): raw-deflated JSON in
    // base64url. Nothing is sent anywhere; the choices stay on this device.
    const lang = (navigator.language || "en").slice(0, 2);
    const strings = {
        en: { title: "Split the bill", yours: "Your part", of: "of {0} · at the receipt’s prices; tips shared in proportion",
              bonus: "Bonuses and discounts −{0} · paid {1}",
              hint: "Tap what’s yours; under it, choose your share: whole, 1/2 … 1/8. − and + set how many of several are yours.",
              table: "At the table", fees: "Fees — shared by everyone at the table", whole: "Whole", clear: "Clear", copy: "Copy my part",
              copied: "Copied", items: "items", broken: "This link is incomplete. Ask for it again.",
              old: "Open this link in Safari or Chrome.", made: "Made with", mine: "My part: {0} — {1}",
              mineTip: "My part: {0} (tips {1}% included) — {2}", tips: "Tips", other: "Other", own: "Your percent",
              tipline: "Items {0} + tips {1}% {2}", tipnote: "A percent of your part, added to it.",
              inReceipt: "The receipt already adds {0} on top of its items — if that is service or tips, it is already in your part." },
        uk: { title: "Поділити рахунок", yours: "Твоя частина", of: "з {0} · за цінами чека; чайові — пропорційно",
              bonus: "Бонуси й знижки −{0} · сплачено {1}",
              hint: "Торкнись свого; під позицією вибери свою частку: ціле, 1/2 … 1/8. − і + — скільки з кількох твоїх.",
              table: "За столом", fees: "Збори — діляться на всіх за столом", whole: "Ціле", clear: "Очистити",
              copy: "Скопіювати мою частину", copied: "Скопійовано", items: "позицій",
              broken: "Посилання неповне. Попроси надіслати його ще раз.",
              old: "Відкрий це посилання в Safari чи Chrome.", made: "Зроблено в", mine: "Моя частина: {0} — {1}",
              mineTip: "Моя частина: {0} (з чайовими {1}%) — {2}", tips: "Чайові", other: "Своє", own: "Свій відсоток",
              tipline: "Позиції {0} + чайові {1}% {2}", tipnote: "Відсоток від твоєї частини, додається до неї.",
              inReceipt: "Чек уже додає {0} понад позиції — якщо це сервіс чи чайові, вони вже у твоїй частині." },
        ru: { title: "Разделить счёт", yours: "Твоя часть", of: "из {0} · по ценам чека; чаевые — пропорционально",
              bonus: "Бонусы и скидки −{0} · оплачено {1}",
              hint: "Нажми на своё; под позицией выбери свою долю: целиком, 1/2 … 1/8. − и + — сколько из нескольких твоих.",
              table: "За столом", fees: "Сборы — делятся на всех за столом", whole: "Целиком", clear: "Очистить",
              copy: "Скопировать мою часть", copied: "Скопировано", items: "позиций",
              broken: "Ссылка неполная. Попроси прислать её ещё раз.",
              old: "Открой эту ссылку в Safari или Chrome.", made: "Сделано в", mine: "Моя часть: {0} — {1}",
              mineTip: "Моя часть: {0} (с чаевыми {1}%) — {2}", tips: "Чаевые", other: "Своё", own: "Свой процент",
              tipline: "Позиции {0} + чаевые {1}% {2}", tipnote: "Процент от твоей части, добавляется к ней.",
              inReceipt: "Чек уже добавляет {0} сверх позиций — если это сервис или чаевые, они уже в твоей части." }
    };
    const t = strings[lang] || strings.en;
    const fill = (text, ...values) => values.reduce((s, v, i) => s.replace("{" + i + "}", v), text);
    document.documentElement.lang = strings[lang] ? lang : "en";
    document.title = t.title;
    const app = document.getElementById("app");

    function fail(message) {
        app.innerHTML = "";
        const p = document.createElement("p");
        p.className = "error";
        p.textContent = message;
        app.appendChild(p);
    }

    async function decode(fragment) {
        let base64 = fragment.replace(/-/g, "+").replace(/_/g, "/");
        base64 += "=".repeat((4 - base64.length % 4) % 4);
        const bytes = Uint8Array.from(atob(base64), c => c.charCodeAt(0));
        const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
        return JSON.parse(await new Response(stream).text());
    }

    function render(receipt) {
        const currency = receipt.c || "UAH";
        let format;
        try {
            format = new Intl.NumberFormat(navigator.language, { style: "currency", currency });
        } catch (error) {
            format = new Intl.NumberFormat(navigator.language, { minimumFractionDigits: 2 });
        }
        const money = minor => format.format(minor / 100);
        const items = (receipt.i || []).map((row, index) => {
            const qty = String(row[2] || "");
            const count = /^\d+$/.test(qty.trim()) ? Number(qty) : 0;
            // A whole quantity above one (15 beers): a friend takes some of them, not a share of the line.
            // A fee (service, delivery, packaging, tips) ends its row in 1: shared by the whole table.
            return { id: index, name: String(row[0] || ""), minor: Number(row[1]) || 0, qty,
                     units: count > 1 && count <= 999 ? count : 0, fee: row[3] === 1 };
        }).filter(item => item.minor > 0);
        const itemsSum = items.reduce((sum, item) => sum + item.minor, 0);
        const total = Number(receipt.t) || itemsSum;
        const key = "dibsly-split-" + location.hash.slice(1, 40);
        // shares[id] = { people: n } or { units: k }; absent = not mine.
        let shares = {};
        let saved = false;
        try {
            const stored = localStorage.getItem(key + "-v2");
            saved = stored !== null;
            shares = JSON.parse(stored || "{}");
        } catch (error) { shares = {}; }
        // How many sit at the table: the sharer's number from the link until this friend changes it.
        const maxPeople = 8;
        const clampPeople = value => Math.min(Math.max(Math.round(Number(value) || 2), 2), maxPeople);
        let people = clampPeople(receipt.n);
        try {
            const stored = localStorage.getItem(key + "-people");
            if (stored !== null) people = clampPeople(stored);
        } catch (error) { /* private mode */ }
        if (!saved) items.filter(item => item.fee).forEach(item => { shares[item.id] = { people }; });
        const fraction = (item, share) => {
            if (!share) return 0;
            if (share.units) return item.units ? Math.min(share.units, item.units) / item.units : 1;
            // { people: 5, k: 2 } is 2/5 of an item cut for five (2026-10-06).
            return share.people ? Math.min(share.k || 1, share.people) / share.people : 0;
        };

        app.innerHTML = "";
        const head = document.createElement("section");
        head.className = "card head";
        head.innerHTML = '<div class="merchant"></div><div class="muted"></div><div class="part"></div><div class="tipline"></div><div class="muted of"></div>';
        head.querySelector(".merchant").textContent = receipt.m || t.title;
        head.querySelector(".muted").textContent = t.yours;
        head.querySelector(".of").textContent = fill(t.of, money(total));
        // Bonuses and discounts are the payer's: shown once, never spread over the items (owner, 2026-10-03).
        if (itemsSum > total * 1.02) {
            const bonus = document.createElement("div");
            bonus.className = "muted";
            bonus.textContent = fill(t.bonus, money(itemsSum - total), money(total));
            head.appendChild(bonus);
        }
        app.appendChild(head);

        const table = document.createElement("section");
        table.className = "card table";
        table.innerHTML = '<strong></strong><button class="round" type="button">−</button><output></output>'
            + '<button class="round" type="button">+</button>';
        table.querySelector("strong").textContent = t.table;
        const [fewer, more] = table.querySelectorAll("button");
        const setPeople = value => {
            const next = clampPeople(value);
            // Fees, and whatever was shared by the whole table, follow the table.
            Object.keys(shares).forEach(id => {
                const share = shares[id];
                if (share.people === people) {
                    shares[id] = share.k && share.k < next ? { people: next, k: share.k } : { people: next };
                }
            });
            people = next;
            update();
        };
        fewer.addEventListener("click", () => setPeople(people - 1));
        more.addEventListener("click", () => setPeople(people + 1));
        app.appendChild(table);

        const list = document.createElement("section");
        list.className = "card";
        const hint = document.createElement("p");
        hint.className = "hint";
        hint.textContent = t.hint;
        list.appendChild(hint);
        // Service, delivery, packaging and tips apart, already shared by the table (2026-10-05).
        const feeList = document.createElement("section");
        feeList.className = "card";
        const feeHead = document.createElement("p");
        feeHead.className = "feehead";
        feeHead.textContent = t.fees;
        feeList.appendChild(feeHead);
        const rows = items.map(item => {
            const row = document.createElement("div");
            row.className = "row";
            const line = document.createElement("div");
            line.className = "partline";
            const part = document.createElement("span");
            part.className = "mine";
            const button = document.createElement("button");
            button.type = "button";
            button.className = "item";
            button.innerHTML = '<span class="check" aria-hidden="true"></span><span class="name"></span><span class="amount"></span>';
            button.querySelector(".name").textContent = item.name;
            if (item.qty && item.qty !== "1") {
                const qty = document.createElement("span");
                qty.className = "qty";
                qty.textContent = "× " + item.qty;
                button.querySelector(".name").appendChild(qty);
            }
            button.querySelector(".amount").textContent = money(item.minor);
            const share = document.createElement("button");
            share.type = "button";
            share.className = "share";
            // Whole, 1/2 … 1/8 for an item that is not counted in units.
            const portion = document.createElement("select");
            portion.className = "share";
            for (let count = 1; count <= maxPeople; count++) {
                const option = document.createElement("option");
                option.value = String(count);
                option.textContent = count === 1 ? t.whole : "1/" + count;
                portion.appendChild(option);
            }
            portion.addEventListener("change", () => {
                shares[item.id] = { people: Number(portion.value) };  // a new size starts at one part
                update();
            });
            const plus = document.createElement("button");
            plus.type = "button";
            plus.className = "share";
            plus.textContent = "+";
            button.addEventListener("click", () => {
                if (shares[item.id]) delete shares[item.id];
                else shares[item.id] = item.units ? { units: 1 } : { people: item.fee ? people : 1 };
                update();
            });
            share.addEventListener("click", () => {
                const current = shares[item.id] || {};
                if (!item.units) {
                    const k = (current.k || 1) - 1;
                    shares[item.id] = k > 1 ? { people: current.people, k } : { people: current.people };
                } else if ((current.units || 0) > 1) shares[item.id] = { units: current.units - 1 };
                else delete shares[item.id];
                update();
            });
            plus.addEventListener("click", () => {
                const current = shares[item.id] || { units: 0 };
                if (!item.units) {
                    // All the parts make the item whole.
                    const k = (current.k || 1) + 1;
                    shares[item.id] = k >= current.people ? { people: 1 } : { people: current.people, k };
                } else shares[item.id] = { units: Math.min((current.units || 0) + 1, item.units) };
                update();
            });
            line.appendChild(part);
            line.appendChild(share);
            line.appendChild(portion);
            line.appendChild(plus);
            row.appendChild(button);
            row.appendChild(line);
            (item.fee ? feeList : list).appendChild(row);
            return { item, button, line, part, share, portion, plus };
        });
        app.appendChild(list);
        if (items.some(item => item.fee)) app.appendChild(feeList);

        // Tips: the sharer's percent from the link (p) until this friend picks their own.
        const presets = [0, 5, 10, 15, 20];
        const clampTip = value => Math.min(Math.max(Math.round(Number(value) || 0), 0), 100);
        let tip = clampTip(receipt.p);
        try {
            const saved = localStorage.getItem(key + "-tip");
            if (saved !== null) tip = clampTip(saved);
        } catch (error) { /* private mode */ }
        let ownTip = !presets.includes(tip);
        const tips = document.createElement("section");
        tips.className = "card";
        tips.innerHTML = '<div class="tiphead"><strong></strong><span class="tipamount"></span></div>'
            + '<div class="chips"></div><label class="tipown"><input type="number" inputmode="numeric" min="0" max="100">'
            + '<span class="muted">%</span></label><p class="muted note tipnote"></p>';
        tips.querySelector("strong").textContent = t.tips;
        tips.querySelector(".tipnote").textContent = t.tipnote;
        const ownRow = tips.querySelector(".tipown");
        const ownInput = ownRow.querySelector("input");
        ownInput.placeholder = t.own;
        ownInput.setAttribute("aria-label", t.own);
        const chips = [...presets, "other"].map(value => {
            const chip = document.createElement("button");
            chip.type = "button";
            chip.className = "chip";
            chip.textContent = value === "other" ? t.other : value + "%";
            chip.addEventListener("click", () => {
                if (value === "other") {
                    // Empty, so what is typed is the percent, not appended to the one before.
                    ownTip = true;
                    ownInput.value = "";
                    tip = 0;
                    update();
                    ownInput.focus();
                } else {
                    ownTip = false;
                    tip = value;
                    update();
                }
            });
            tips.querySelector(".chips").appendChild(chip);
            return { value, chip };
        });
        ownInput.addEventListener("input", () => {
            tip = clampTip(ownInput.value);
            if (Number(ownInput.value) > 100) ownInput.value = "100";
            update();
        });
        if (itemsSum && total > itemsSum * 1.02) {
            const note = document.createElement("p");
            note.className = "muted note";
            note.textContent = fill(t.inReceipt, money(total - itemsSum));
            tips.appendChild(note);
        }
        app.appendChild(tips);

        const footer = document.createElement("p");
        footer.className = "muted footer";
        footer.innerHTML = t.made + ' <a href="https://dmytromelinevskyi.github.io/dibsly-support/">Dibsly</a>';
        app.appendChild(footer);

        const myPart = () => {
            if (!itemsSum) return 0;
            const mine = items.reduce((sum, item) => sum + item.minor * fraction(item, shares[item.id]), 0);
            // At the receipt's prices; only tips or service on top of the items follow in proportion.
            return Math.round(mine * Math.max(total / itemsSum, 1));
        };

        function update() {
            table.querySelector("output").textContent = String(people);
            fewer.disabled = people <= 2;
            more.disabled = people >= maxPeople;
            rows.forEach(({ item, button, line, part, share, portion, plus }) => {
                const current = shares[item.id];
                const mine = Boolean(current);
                button.classList.toggle("mine", mine);
                button.setAttribute("aria-pressed", mine ? "true" : "false");
                button.querySelector(".check").textContent = mine ? "✓" : "";
                line.hidden = !mine;
                const parts = !item.units && current && current.people > 1;
                plus.hidden = !item.units && !parts;
                share.hidden = !item.units && !(parts && current.k > 1);
                portion.hidden = Boolean(item.units);
                if (!mine) return;
                const amount = money(Math.round(item.minor * fraction(item, current)));
                if (item.units) {
                    share.textContent = "−";
                    plus.disabled = current.units >= item.units;
                    part.textContent = current.units + "/" + item.units + " · " + amount;
                } else {
                    portion.value = String(current.people || 1);
                    share.textContent = "−";
                    plus.disabled = false;
                    const label = (current.k || 1) + "/" + current.people;
                    part.textContent = (current.people > 1 ? label + " · " : "") + amount;
                }
            });
            const base = myPart();
            const tipAmount = Math.round(base * tip / 100);
            head.querySelector(".part").textContent = money(base + tipAmount);
            head.querySelector(".tipline").textContent = tipAmount > 0 ? fill(t.tipline, money(base), tip, money(tipAmount)) : "";
            tips.querySelector(".tipamount").textContent = tipAmount > 0 ? "+" + money(tipAmount) : "";
            chips.forEach(({ value, chip }) => {
                const on = value === "other" ? ownTip : !ownTip && value === tip;
                chip.classList.toggle("on", on);
                chip.setAttribute("aria-pressed", on ? "true" : "false");
            });
            ownRow.hidden = !ownTip;
            if (ownTip && ownInput.value === "" && tip > 0) ownInput.value = String(tip);
            try {
                localStorage.setItem(key + "-v2", JSON.stringify(shares));
                localStorage.setItem(key + "-tip", String(tip));
                localStorage.setItem(key + "-people", String(people));
            } catch (error) { /* private mode */ }
        }

        const bar = document.getElementById("bar");
        const clear = document.getElementById("clear");
        const copy = document.getElementById("copy");
        clear.textContent = t.clear;
        copy.textContent = t.copy;
        clear.addEventListener("click", () => {
            // Fees stay shared by the table: they are everyone's.
            shares = {};
            items.filter(item => item.fee).forEach(item => { shares[item.id] = { people }; });
            update();
        });
        copy.addEventListener("click", async () => {
            const names = items.filter(item => shares[item.id]).map(item => {
                const share = shares[item.id];
                if (share.units) return item.name + " ×" + share.units;
                return share.people > 1 ? item.name + " (" + (share.k || 1) + "/" + share.people + ")" : item.name;
            });
            const base = myPart();
            const tipAmount = Math.round(base * tip / 100);
            const text = tipAmount > 0 ? fill(t.mineTip, money(base + tipAmount), tip, names.join(", "))
                : fill(t.mine, money(base), names.join(", "));
            try {
                await navigator.clipboard.writeText(text);
                copy.textContent = t.copied;
                setTimeout(() => { copy.textContent = t.copy; }, 1500);
            } catch (error) { /* clipboard not allowed */ }
        });
        bar.hidden = false;
        update();
    }

    const fragment = location.hash.slice(1);
    if (!fragment) return fail(t.broken);
    if (typeof DecompressionStream === "undefined") return fail(t.old);
    decode(fragment).then(receipt => {
        if (!receipt || receipt.v !== 1) return fail(t.broken);
        render(receipt);
    }).catch(() => fail(t.broken));
})();
</script>
</body>
</html>
